<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Work · Rechab</title>
<meta name="description" content="Websites and tools built by Rechab.">
<meta name="theme-color" content="#0b1430">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23f6c453'/><text x='50' y='70' font-size='62' font-family='Arial' font-weight='700' text-anchor='middle' fill='%230b1430'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">Rechab<span>.</span></a>
    <div class="nav-links">
      <a href="story.html">Story</a>
      <a href="work.html" aria-current="page">Work</a>
      <a href="services.html">Services</a>
      <a class="pill" href="services.html#contact">Contact</a>
    </div>
  </div>
</nav>

<main>
  <header class="page-head">
    <span class="eyebrow">Live sites</span>
    <h1>My Work</h1>
    <p class="lead">Every site I've built and published. Tap one to open it.</p>
  </header>

  <div class="grid projects" id="grid" aria-live="polite"></div>
  <p class="status" id="status"></p>
</main>

<footer>
  <span>© <span id="yr"></span> Rechab</span>
  <span><a href="https://github.com/Menfis23">GitHub</a></span>
</footer>

<script>
(function(){
  const USER = 'Menfis23';
  // Repos to leave off the grid (the portfolio itself, plus anything you want hidden).
  const HIDE = [USER.toLowerCase() + '.github.io'];
  // Per-site details. "shot" = a real screenshot of the site (in shots/), "logo" = the site's own logo (in logos/).
  // A new site you publish still shows up automatically; add a line here to give it a screenshot or logo.
  const OVERRIDES = {
    'road-to-25':             { name: 'Road to 25',            shot: 'shots/road-to-25.jpg' },
    'stem-lesson-gallery':    { name: 'STEM Lesson Gallery',   shot: 'shots/stem-lesson-gallery.jpg',    logo: 'logos/stem-lesson-gallery.jpg' },
    'aryse-english-gallery':  { name: 'English Activity Gallery', shot: 'shots/aryse-english-gallery.jpg' },
    'hilldiscrit-map-projet': { name: 'Hill District Community Plan', shot: 'shots/hilldiscrit-map-projet.jpg' },
    'valore-arc-site':        { name: 'Valore Group',          shot: 'shots/valore-arc-site.jpg',        logo: 'logos/valore-arc-site.jpg', url: 'https://valore-arc.com/' }
  };
  const TINTS = ['#2b3a73','#1f5c58','#5a3d73','#6b3b2e','#2f4f2f','#3b4b63'];

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  document.getElementById('yr').textContent = new Date().getFullYear();

  const prettify = n => n.replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const hash = s => [...s].reduce((h,c)=>(h*31 + c.charCodeAt(0))>>>0, 7);
  const siteUrl = r => r.homepage && /^https?:\/\//.test(r.homepage) ? r.homepage : `https://${USER.toLowerCase()}.github.io/${r.name}/`;

  function el(tag, cls, text){ const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; }

  function tile(repo){
    const o = OVERRIDES[repo.name.toLowerCase()] || {};
    const name = o.name || prettify(repo.name);
    const url = o.url || siteUrl(repo);
    const a = el('a','project');
    a.href = url;
    a.target = '_blank'; a.rel = 'noopener';

    const shot = el('div','shot');
    if(o.shot){
      const img = new Image();
      img.src = o.shot; img.alt = `Screenshot of ${name}`; img.loading = 'lazy';
      shot.appendChild(img);
    } else {
      shot.style.background = TINTS[hash(repo.name) % TINTS.length];
    }
    a.appendChild(shot);

    const body = el('div','project-body');
    const logo = el('div','logo');
    if(o.logo){ const li = new Image(); li.src = o.logo; li.alt = `${name} logo`; logo.appendChild(li); }
    else { logo.textContent = initials(name); logo.style.background = TINTS[hash(repo.name) % TINTS.length]; }
    body.appendChild(logo);

    const text = el('div');
    const h3 = el('h3',null,name);
    h3.appendChild(el('span','arrow-sm','↗'));
    text.appendChild(h3);
    if(repo.description) text.appendChild(el('p',null,repo.description));
    text.appendChild(el('span','domain', url.replace(/^https?:\/\//,'').replace(/\/$/,'')));
    body.appendChild(text);
    a.appendChild(body);
    return a;
  }

  // Loading placeholders
  for(let i=0;i<3;i++) grid.appendChild(el('div','project skeleton'));

  fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(repos => {
      const sites = repos
        .filter(r => r.has_pages && !r.fork && !r.archived && !HIDE.includes(r.name.toLowerCase()))
        .sort((a,b) => new Date(b.pushed_at) - new Date(a.pushed_at));
      grid.innerHTML = '';
      if(!sites.length){ status.textContent = 'No live sites yet. Check back soon.'; return; }
      sites.forEach(r => grid.appendChild(tile(r)));
    })
    .catch(() => {
      grid.innerHTML = '';
      status.innerHTML = '';
      status.append("Couldn't load the list right now. ");
      const l = el('a',null,'See everything on GitHub →'); l.href = `https://github.com/${USER}?tab=repositories`;
      status.appendChild(l);
    });
})();
</script>
</body>
</html>
